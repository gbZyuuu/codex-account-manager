<!doctype html>
<html lang="en-US">
<meta charset="utf-8">
<title>Codex Account Manager — documentation preview</title>
<!-- The surrounding Codex chrome is a fixture. The panel and quota button are
     rendered by the unchanged production payload, with synthetic IPC data only. -->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #181818; color: #eee; font: 13px/1.35 Arial, sans-serif;
    --color-token-text-primary: #eee; --color-token-text-secondary: #b6b6b6; }
  [hidden] { display: none !important; }
  [role="menu"] { position: absolute; left: 16px; top: 16px; width: 380px;
    padding: 5px; background: #292929; border-radius: 20px; }
  .identity { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #414141;
    margin: 2px 8px 6px; padding: 7px 0 12px; }
  .identity small { display: block; color: #aaa; font-size: 11px; }
  .avatar { display: grid; place-items: center; width: 19px; height: 19px;
    border-radius: 50%; background: #8d53a0; font-size: 8px; }
  .native { display: flex; align-items: center; gap: 8px; min-height: 29px; padding: 6px 10px; }
  .native .shortcut { margin-left: auto; color: #999; font-size: 12px; }
  .divider { border-top: 1px solid #414141; margin: 5px 10px; }
  svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.4; }
  .native svg { color: #bbb; }
  #profile-preview { position: absolute; top: 1000px; left: 16px; }
  #composer-preview { position: absolute; left: 16px; top: 600px; width: 736px;
    display: flex; flex-direction: column; background: #333; border-radius: 24px; overflow: hidden; }
  textarea { background: transparent; color: inherit; border: 0; resize: none; outline: none;
    height: 61px; padding: 16px 12px 8px; font: inherit; }
  textarea::placeholder { color: #828282; }
  .toolbar { display: flex; align-items: center; gap: 16px; height: 40px; padding: 0 12px 9px; }
  .approval { display: flex; align-items: center; gap: 6px; color: #a8a8a8; }
  .model { display: flex; align-items: center; gap: 4px; margin-left: auto; }
  .muted { color: #aaa; }
  .voice { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: white; color: #333; }
</style>
<div role="menu">
  <div class="identity"><span class="avatar">DE</span><span>Demo<small id="plan">Plus</small></span></div>
  <div role="menuitem" class="native">Usage</div>
  <div role="menuitem" class="native"><svg viewBox="0 0 24 24"><path d="M5 14c0-6 3-10 7-10s7 4 7 10a7 7 0 0 1-14 0Z"/><path d="M9 11v3m6-3v3m-6 3c2 1 4 1 6 0"/></svg>Show Pet<span class="shortcut">Alt+Win+P</span></div>
  <div role="menuitem" class="native"><svg viewBox="0 0 24 24"><path d="m12 3 2 3 4-1 1 4 3 3-3 3-1 4-4-1-2 3-2-3-4 1-1-4-3-3 3-3 1-4 4 1Z"/><circle cx="12" cy="12" r="3"/></svg>Settings<span class="shortcut">Ctrl+,</span></div>
  <div class="divider"></div>
  <div role="menuitem" class="native"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><path d="m6 6 3 3m6 6 3 3M6 18l3-3m6-6 3-3"/></svg>Help<span class="shortcut">›</span></div>
  <div role="menuitem" class="native"><svg viewBox="0 0 24 24"><path d="M10 4H5v16h5m4-12 4 4-4 4m-5-4h9"/></svg>Sign out</div>
</div>
<button id="profile-preview" aria-label="Open profile menu" aria-haspopup="menu">Profile</button>
<div id="composer-preview" data-composer-surface-variant="default" data-composer-layout="multiline">
  <textarea aria-label="Message" placeholder="Work with Codex"></textarea>
  <div class="toolbar">
    <svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg>
    <span class="approval"><svg viewBox="0 0 24 24"><path d="M6 7 12 3l6 4v10l-6 4-6-4Z"/><path d="m10 9 3 3-3 3"/></svg>Approve on my behalf</span>
    <span class="model"><svg viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><path d="m13 2-9 12h7l-1 8 10-13h-7Z"/></svg>GPT-6 Astra <span class="muted">High</span><svg viewBox="0 0 24 24" style="width:12px"><path d="m7 10 5 5 5-5"/></svg></span>
    <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M6 11v1a6 6 0 0 0 12 0v-1m-6 7v4"/></svg>
    <span class="voice"><svg viewBox="0 0 24 24"><path d="M6 9v6m4-10v14m4-12v10m4-8v6"/></svg></span>
  </div>
</div>
<script>
  // Fixed clock makes the rendered reset dates reproducible.
  const NativeDate = Date;
  Date = class extends NativeDate {
    constructor(...args) { super(...(args.length ? args : [Date.now()])); }
    static now() { return NativeDate.parse('2026-10-23T15:00:00Z'); }
  };
  var module = { exports: {} };
</script>
<script src="../payload/index.js"></script>
<script>
  const weeklyOnly = new URLSearchParams(location.search).get('windows') === 'weekly';
  document.querySelector('#plan').textContent = weeklyOnly ? 'Pro' : 'Plus';
  const rows = [
    { label: 'demo-1', email: 'alex@example.invalid', plan: weeklyOnly ? 'pro' : 'plus', current: true,
      fiveHour: weeklyOnly ? null : { remaining: 67, resetAtMs: Date.now() + 3 * 3600000 },
      weekly: { remaining: 40, resetAtMs: Date.now() + 6 * 86400000 }, resets: 0 },
    { label: 'demo-2', email: 'sam@example.invalid', plan: weeklyOnly ? 'pro' : 'plus', current: false,
      fiveHour: weeklyOnly ? null : { remaining: 92, resetAtMs: Date.now() + 4 * 3600000 },
      weekly: { remaining: 78, resetAtMs: Date.now() + 3 * 86400000 }, resets: 2 }
  ];
  module.exports.start({ process: 'renderer', manifest: { id: 'readme-preview' },
    log: { info() {}, warn: console.warn, error: console.error },
    ipc: { invoke: async channel => {
      if (channel === 'usage:all') return { rows };
      if (channel === 'usage:active') return { row: rows[0] };
      if (channel === 'update:status') return { available: false };
      throw Error('Documentation preview cannot perform account operations');
    } }
  });
  document.querySelector('#profile-preview').addEventListener('keydown', event => {
    if (event.key === 'ArrowDown') document.querySelector('[role="menu"]').hidden = false;
  });
</script>
</html>
